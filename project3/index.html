
<!DOCTYPE html>
<html>
<head>
  <title>Peekaboo Cat</title>
  <style>
    body {
      background: black;
      margin: 0;
    }

    .cat {
      position: relative;
      width: 420px;
      margin: 80px auto;
    }

    .head {
      background: white;
      width: 400px;
      height: 225px;
      border-radius: 45% 45% 10% 10%;
      position: relative;
    }

    .ear {
      position: absolute;
      top: -45px;
      width: 110px;
      height: 120px;
      background: white;
      clip-path: polygon(0 100%, 10% 0, 100% 65%);
    }

    .left-ear {
      left: 10px;
    }

    .right-ear {
      right: 10px;
      transform: scaleX(-1);
    }

    .eye {
      position: absolute;
      top: 85px;
      width: 85px;
      height: 90px;
      background: black;
      border-radius: 50%;
    }

    .left-eye {
      left: 45px;
    }

    .right-eye {
      right: 45px;
    }

    .shine {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 8px;
      height: 35px;
      background: white;
      border-radius: 50%;
    }

    .nose {
      position: absolute;
      top: 160px;
      left: 190px;
      width: 20px;
      height: 12px;
      background: black;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .paw {
      position: absolute;
      top: 265px;
      width: 105px;
      height: 55px;
      background: white;
      border-radius: 50%;
    }

    .left-paw {
      left: -165px;
    }

    .right-paw {
      right: -105px;
    }

    .whiskers {
      position: absolute;
      top: 175px;
      width: 35px;
      height: 3px;
      background: white;
    }

    .left-whiskers {
      left: -5px;
      transform: rotate(10deg);
    }

    .right-whiskers {
      right: -5px;
      transform: rotate(-10deg);
    }
  </style>
</head>

<body>
  <div class="cat">
    <div class="head">
      <div class="ear left-ear"></div>
      <div class="ear right-ear"></div>

      <div class="eye left-eye">
        <div class="shine"></div>
      </div>

      <div class="eye right-eye">
        <div class="shine"></div>
      </div>

      <div class="nose"></div>
      <div class="whiskers left-whiskers"></div>
      <div class="whiskers right-whiskers"></div>
    </div>

    <div class="paw left-paw"></div>
    <div class="paw right-paw"></div>
  </div>
</body>
</html>
